<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الاستعلام عن نتائج الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F8F4;
    --paper-2:#FFFFFF;
    --ink:#16261D;
    --muted:#5B6F63;
    --green-deep:#0E4C3C;
    --green:#1B7A5B;
    --green-soft:#DCEEE3;
    --green-line:#BFDCCB;
    --gold:#A9834F;
    --red:#A5432F;
    --amber:#B4823A;
    --shadow: 0 10px 30px -14px rgba(14,76,60,0.35);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(900px 500px at 50% -8%, #EAF3EC 0%, var(--paper) 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 16px 90px;
  }
  .serif{ font-family:'Amiri', serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  /* -------- منع محاولات النسخ/التصوير العادية -------- */
  body, .no-select{
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; }
  img{ -webkit-user-drag:none; user-drag:none; pointer-events:none; }
  @media print{
    body::before{
      content:"لا يمكن طباعة هذه الصفحة";
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      font-size:28px; color:#000; background:#fff;
    }
    body *{ display:none !important; }
  }

  header{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:36px;
  }
  .seal{ width:64px; height:64px; margin-bottom:14px; }
  header h1{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 6px;
    color:var(--green-deep);
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  /* غيّر النص ده لاسم المعهد/الكلية الفعلي */
  .institute-name{ font-size:13px; color:var(--gold); letter-spacing:0.3px; margin-top:6px; }

  main{ width:100%; max-width:760px; }

  /* -------- كارت البحث -------- */
  .search-card{
    background:var(--paper-2);
    border:1px solid var(--green-line);
    border-radius:16px;
    padding:36px 32px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .search-card label{
    display:block;
    font-size:14px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .code-input{
    width:100%;
    max-width:340px;
    font-family:'JetBrains Mono', monospace;
    font-size:18px;
    letter-spacing:1px;
    text-align:center;
    direction:ltr;
    unicode-bidi:bidi-override;
    padding:14px 16px;
    border:1.5px solid var(--green-line);
    border-radius:10px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
    transition:border-color 0.15s ease;
  }
  .code-input:focus{ border-color:var(--green); }
  .search-card button{
    display:block;
    margin:20px auto 0;
    background:var(--green-deep);
    color:#fff;
    border:none;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:13px 40px;
    border-radius:10px;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  .search-card button:hover{ background:var(--green); transform:translateY(-1px); }
  .search-card button:disabled{ background:#9FB3A7; cursor:default; transform:none; }
  .error-msg{
    color:var(--red);
    font-size:13.5px;
    margin-top:14px;
    min-height:18px;
  }
  .hint{
    color:var(--muted);
    font-size:12px;
    margin-top:22px;
    line-height:1.9;
  }

  /* -------- كارت النتيجة -------- */
  .result-wrap{ position:relative; overflow:hidden; border-radius:16px; }
  .result-card{
    background:var(--paper-2);
    border:1px solid var(--green-line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:32px;
    position:relative;
  }
  .watermark{
    position:absolute; inset:0;
    pointer-events:none;
    display:flex; flex-wrap:wrap; align-content:space-around; justify-content:space-around;
    transform:rotate(-28deg) scale(1.3);
    opacity:0.07;
    z-index:5;
  }
  .watermark span{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--green-deep);
    white-space:nowrap;
    margin:14px 22px;
  }

  .student-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:1.5px solid var(--green-line);
    padding-bottom:20px;
    margin-bottom:20px;
  }
  .student-head h2{
    font-family:'Amiri', serif;
    font-size:24px;
    margin:0 0 8px;
    color:var(--green-deep);
  }
  .student-head .code{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--muted);
  }
  .meta-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:8px 24px;
    font-size:13px;
    color:var(--muted);
    min-width:230px;
  }
  .meta-grid b{ color:var(--ink); font-weight:600; }

  .stats-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
    margin-bottom:28px;
  }
  .stat-box{
    background:var(--green-soft);
    border:1px solid var(--green-line);
    border-radius:12px;
    padding:16px 10px;
    text-align:center;
  }
  .stat-box .label{ font-size:12px; color:var(--green-deep); margin-bottom:6px; }
  .stat-box .val{ font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:700; color:var(--green-deep); }

  .semester{ margin-bottom:26px; }
  .semester-title{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:15px;
    font-weight:700;
    color:var(--green-deep);
    margin-bottom:10px;
    padding-right:10px;
    border-right:3px solid var(--green);
  }
  .semester-title .year{ font-family:'JetBrains Mono', monospace; font-weight:500; color:var(--muted); font-size:12.5px; }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    background:var(--paper-2);
  }
  thead th{
    background:var(--paper);
    color:var(--muted);
    font-weight:600;
    font-size:11.5px;
    text-align:right;
    padding:9px 10px;
    border-bottom:1.5px solid var(--green-line);
  }
  tbody td{
    padding:9px 10px;
    border-bottom:1px solid #EDF2EE;
    color:var(--ink);
  }
  tbody tr:last-child td{ border-bottom:none; }
  td.num, th.num{ font-family:'JetBrains Mono', monospace; text-align:center; }

  .grade{
    display:inline-block;
    min-width:34px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:12.5px;
    padding:3px 8px;
    border-radius:6px;
  }
  .grade.pass{ background:#DCEEE3; color:var(--green-deep); }
  .grade.mid{ background:#F5E9D6; color:var(--amber); }
  .grade.fail{ background:#F5DFDA; color:var(--red); }

  .semester-summary{
    display:flex;
    justify-content:flex-end;
    gap:22px;
    flex-wrap:wrap;
    margin-top:10px;
    padding-top:10px;
    font-size:12.5px;
    color:var(--muted);
  }
  .semester-summary b{ font-family:'JetBrains Mono', monospace; color:var(--green-deep); }

  .back-btn{
    display:block;
    margin:26px auto 0;
    background:transparent;
    border:1.5px solid var(--green-line);
    color:var(--green-deep);
    font-family:'Cairo', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:10px 26px;
    border-radius:10px;
    cursor:pointer;
  }
  .back-btn:hover{ background:var(--green-soft); }

  .privacy-note{
    max-width:520px;
    text-align:center;
    color:var(--muted);
    font-size:11.5px;
    line-height:2;
    margin:34px auto 0;
  }

  /* غطاء تحذيري لو المستخدم بدّل التبويب أو فقد التركيز */
  #focusGuard{
    position:fixed; inset:0;
    background:rgba(16,38,29,0.94);
    color:#EAF3EC;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:999;
    font-family:'Cairo', sans-serif;
    font-size:15px;
    padding:20px;
  }
  #focusGuard.show{ display:flex; }

  @media (max-width:520px){
    .student-head{ flex-direction:column; }
    .stats-row{ grid-template-columns:1fr; }
    table{ font-size:11.5px; }
    thead th, tbody td{ padding:7px 6px; }
  }
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

<div id="focusGuard">أعد فتح الصفحة لعرض البيانات</div>

<header>
  <svg class="seal" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="30" stroke="#0E4C3C" stroke-width="2"/>
    <circle cx="32" cy="32" r="23" stroke="#A9834F" stroke-width="1.2"/>
    <path d="M20 33l8 8 16-17" stroke="#1B7A5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>بوابة الاستعلام عن نتائج الطلاب</h1>
  <p>أدخل كود الطالب لعرض النتيجة التفصيلية</p>
  <div class="institute-name">المعهد العالي للإدارة ونظم المعلومات</div>
</header>

<main>
  <section class="search-card" id="searchCard">
    <label for="codeInput">كود الطالب</label>
    <input id="codeInput" class="code-input mono" type="text" dir="ltr" placeholder="22-0783511694" autocomplete="off">
    <div class="error-msg" id="errorMsg"></div>
    <button id="searchBtn">استعلام</button>
    <div class="hint">النتيجة اللي هتظهر خاصة بيك فقط، ومحدش تاني يقدر يشوفها غير باستخدام الكود بتاعك.</div>
  </section>

  <section class="result-wrap" id="resultWrap" style="display:none;"></section>
</main>

<script>
const searchCard = document.getElementById('searchCard');
const resultWrap = document.getElementById('resultWrap');
const codeInput = document.getElementById('codeInput');
const searchBtn = document.getElementById('searchBtn');
const errorMsg = document.getElementById('errorMsg');
const focusGuard = document.getElementById('focusGuard');

const GRADE_CLASS = {
  'A+':'pass','A':'pass','B+':'pass','B':'pass',
  'C+':'mid','C':'mid','D+':'mid',
  'D':'fail','F':'fail'
};

function gradeClass(letter){
  return GRADE_CLASS[letter] || 'mid';
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function buildWatermark(code){
  const stampHtml = `<bdi dir="ltr" style="unicode-bidi:bidi-override;">${escapeHtml(code)}</bdi> · ${escapeHtml(new Date().toLocaleString('ar-EG'))}`;
  let html = '';
  for(let i=0;i<40;i++){ html += `<span>${stampHtml}</span>`; }
  return `<div class="watermark">${html}</div>`;
}

function renderStudent(student){
  const semestersHtml = student.semesters.map(sem => {
    const rows = sem.courses.map(c => `
      <tr>
        <td>${escapeHtml(c.name)}</td>
        <td class="num">${escapeHtml(c.code)}</td>
        <td class="num">${c.creditHours ?? '—'}</td>
        <td class="num">${c.totalScore ?? '—'}</td>
        <td class="num"><span class="grade ${gradeClass(c.letter)}">${escapeHtml(c.letter ?? '—')}</span></td>
        <td class="num">${c.gradePoints ?? '—'}</td>
      </tr>`).join('');

    const s = sem.summary || {};
    return `
      <div class="semester">
        <div class="semester-title">
          <span>${escapeHtml(sem.semesterName)}</span>
          <span class="year">${escapeHtml(sem.academicYear)}</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>المقرر</th>
              <th class="num">الكود</th>
              <th class="num">الساعات</th>
              <th class="num">الدرجة</th>
              <th class="num">التقدير</th>
              <th class="num">نقاط الجودة</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="semester-summary">
          <span>نقاط جودة الفصل: <b>${s.qualityPoints ?? '—'}</b></span>
          <span>المعدل الفصلي: <b>${s.semesterGPA ?? '—'}</b></span>
          <span>الساعات المكتسبة: <b>${s.semesterGainedHours ?? '—'}</b></span>
        </div>
      </div>`;
  }).join('');

  const qp = student.qualificationPercentage
    ? (String(student.qualificationPercentage).includes('%')
        ? student.qualificationPercentage
        : student.qualificationPercentage + '%')
    : '—';

  resultWrap.innerHTML = `
    ${buildWatermark(student.code)}
    <div class="result-card">
      <div class="student-head">
        <div>
          <h2 class="serif">${escapeHtml(student.name)}</h2>
          <div class="code mono">كود الطالب: <bdi dir="ltr" style="unicode-bidi:bidi-override;">${escapeHtml(student.code)}</bdi></div>
        </div>
        <div class="meta-grid">
          <div>التخصص: <b>${escapeHtml(student.majorName ?? '—')}</b></div>
          <div>المؤهل: <b>${escapeHtml(student.qualificationType ?? '—')}</b></div>
          <div>محل الميلاد: <b>${escapeHtml(student.placeOfBirth ?? '—')}</b></div>
          <div>تاريخ الميلاد: <b>${escapeHtml(student.birthDate ?? '—')}</b></div>
          <div>سنة الحصول على المؤهل: <b>${escapeHtml(student.qualificationYear ?? '—')}</b></div>
          <div>نسبة المؤهل: <b>${escapeHtml(qp)}</b></div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="label">المعدل التراكمي</div>
          <div class="val">${student.cgpa ?? '—'}</div>
        </div>
        <div class="stat-box">
          <div class="label">إجمالي الساعات المكتسبة</div>
          <div class="val">${student.totalGainedHours ?? '—'}</div>
        </div>
        <div class="stat-box">
          <div class="label">إجمالي نقاط الجودة</div>
          <div class="val">${student.totalQualityPoints ?? '—'}</div>
        </div>
      </div>

      ${semestersHtml}

      <button class="back-btn" id="backBtn">استعلام عن كود تاني</button>
    </div>
  `;

  searchCard.style.display = 'none';
  resultWrap.style.display = 'block';
  document.getElementById('backBtn').addEventListener('click', () => {
    resultWrap.style.display = 'none';
    resultWrap.innerHTML = '';
    searchCard.style.display = 'block';
    codeInput.value = '';
    errorMsg.textContent = '';
    codeInput.focus();
  });
}

async function doSearch(){
  const code = codeInput.value.trim();
  errorMsg.textContent = '';
  if(!code){
    errorMsg.textContent = 'من فضلك أدخل كود الطالب.';
    return;
  }
  searchBtn.disabled = true;
  searchBtn.textContent = 'جارٍ البحث...';
  try{
    const res = await fetch('/api/result', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if(!res.ok || !data.ok){
      errorMsg.textContent = data.message || 'حدث خطأ، حاول مرة أخرى.';
    }else{
      renderStudent(data.student);
    }
  }catch(err){
    errorMsg.textContent = 'تعذّر الاتصال بالسيرفر، تأكد من اتصالك بالإنترنت.';
  }
  searchBtn.disabled = false;
  searchBtn.textContent = 'استعلام';
}

searchBtn.addEventListener('click', doSearch);
codeInput.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });

/* -------- إجراءات ردع إضافية (مش منع مضمون 100%) -------- */
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  const blocked =
    e.key === 'F12' ||
    (e.ctrlKey && (k === 'p' || k === 's' || k === 'u')) ||
    (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'c' || k === 'j'));
  if(blocked){ e.preventDefault(); }
});

function showGuard(){ if(resultWrap.style.display === 'block') focusGuard.classList.add('show'); }
function hideGuard(){ focusGuard.classList.remove('show'); }
window.addEventListener('blur', showGuard);
window.addEventListener('focus', hideGuard);
document.addEventListener('visibilitychange', () => {
  if(document.hidden) showGuard(); else hideGuard();
});
</script>

</body>
</html>
